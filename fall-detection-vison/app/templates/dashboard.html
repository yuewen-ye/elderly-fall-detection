<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老年人跌倒检测系统 - 监控中心</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0e14; color:#c9d1d9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace; font-size:14px; }
.container { max-width:1280px; margin:0 auto; padding:16px; }
.header { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #21262d; margin-bottom:16px; }
.header h1 { font-size:18px; font-weight:600; color:#58a6ff; }
.header .status { display:flex; gap:16px; font-size:12px; }
.status-item { display:flex; align-items:center; gap:6px; }
.dot { width:8px; height:8px; border-radius:50%; }
.dot.green { background:#3fb950; } .dot.yellow { background:#d29922; } .dot.red { background:#f85149; }
.main { display:grid; grid-template-columns:280px 1fr 300px; gap:16px; }
@media (max-width:900px) { .main { grid-template-columns:1fr; } }
.panel { background:#161b22; border:1px solid #21262d; border-radius:8px; overflow:hidden; }
.panel-header { padding:10px 14px; font-size:13px; font-weight:600; color:#8b949e; border-bottom:1px solid #21262d; text-transform:uppercase; letter-spacing:0.5px; }
.panel-body { padding:14px; }
.tabs { display:flex; gap:0; margin-bottom:16px; }
.tab-btn { padding:8px 20px; background:#0d1117; border:1px solid #21262d; color:#8b949e; cursor:pointer; font-size:13px; border-right:none; }
.tab-btn:first-child { border-radius:6px 0 0 6px; }
.tab-btn:last-child { border-radius:0 6px 6px 0; border-right:1px solid #21262d; }
.tab-btn.active { background:#1f6feb; color:#fff; border-color:#1f6feb; }
.dropzone { border:2px dashed #30363d; border-radius:8px; padding:48px 20px; text-align:center; cursor:pointer; transition:border-color 0.2s; }
.dropzone:hover { border-color:#1f6feb; }
.dropzone svg { width:48px; height:48px; margin-bottom:12px; color:#30363d; }
.dropzone p { color:#484f58; font-size:13px; }
.btn { display:inline-block; padding:8px 20px; background:#238636; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:500; margin-top:12px; }
.btn:hover { background:#2ea043; }
.btn.blue { background:#1f6feb; } .btn.blue:hover { background:#388bfd; }
.btn.ack { background:#6e40c9; font-size:12px; padding:4px 12px; margin:0; }
.result-area { margin-top:0; min-height:200px; }
.result-img { max-width:100%; border-radius:6px; border:1px solid #21262d; }
.person-card { background:#0d1117; border:1px solid #21262d; border-radius:6px; padding:10px; margin-bottom:8px; font-size:12px; }
.person-card .label { font-weight:600; margin-bottom:4px; }
.person-card .label.fall { color:#f85149; }
.person-card .label.normal { color:#3fb950; }
.conf-bar { height:4px; background:#21262d; border-radius:2px; margin-top:6px; overflow:hidden; }
.conf-fill { height:100%; border-radius:2px; }
.conf-fill.green { background:#3fb950; } .conf-fill.red { background:#f85149; }
.feature-row { display:flex; justify-content:space-between; color:#484f58; margin-top:4px; }
.feature-row span { color:#8b949e; }
.timeline-item { padding:10px 0; border-bottom:1px solid #21262d; font-size:12px; }
.timeline-item:last-child { border-bottom:none; }
.timeline-item .time { color:#484f58; font-size:11px; }
.timeline-item .msg { margin-top:4px; color:#8b949e; }
.timeline-item .transition { font-weight:500; }
.transition.arrow { color:#d29922; }
.transition.to-fallen { color:#f85149; }
.transition.to-falling { color:#d29922; }
.transition.to-upright { color:#3fb950; }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; }
.badge.warning { background:#d2992222; color:#d29922; border:1px solid #d2992244; }
.badge.critical { background:#f8514922; color:#f85149; border:1px solid #f8514944; }
.badge.emergency { background:#bc8cff22; color:#bc8cff; border:1px solid #bc8cff44; }
.badge.info { background:#58a6ff22; color:#58a6ff; border:1px solid #58a6ff44; }
.badge.none { background:#3fb95022; color:#3fb950; border:1px solid #3fb95044; }
.alert-banner { background:#f8514915; border:1px solid #f8514944; border-radius:6px; padding:12px 16px; margin-bottom:16px; display:none; align-items:center; justify-content:space-between; }
.alert-banner .left { flex:1; }
.alert-banner .level { font-weight:600; color:#f85149; font-size:15px; }
.alert-banner .msg { margin-top:4px; font-size:13px; color:#c9d1d9; }
.alert-banner.show { display:flex; }
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat-card { background:#0d1117; border:1px solid #21262d; border-radius:6px; padding:10px; text-align:center; }
.stat-card .num { font-size:24px; font-weight:600; }
.stat-card .label { font-size:11px; color:#484f58; margin-top:2px; }
.loading { display:none; text-align:center; padding:20px; color:#8b949e; }
.spinner { width:24px; height:24px; border:3px solid #21262d; border-top-color:#1f6feb; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 8px; }
@keyframes spin { to { transform:rotate(360deg); } }
.transition-detail { background:#0d1117; border-radius:4px; padding:8px; margin-top:6px; border-left:3px solid #21262d; }
.transition-detail.fall { border-left-color:#f85149; }
.transition-detail.warn { border-left-color:#d29922; }
.transition-detail.ok { border-left-color:#3fb950; }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>🛡 老年人跌倒检测系统</h1>
  <div class="status">
    <div class="status-item"><span class="dot green"></span> 系统在线</div>
    <div class="status-item" id="stat-alerts">警报: 0</div>
  </div>
</div>

<div class="alert-banner" id="alertBanner">
  <div class="left">
    <span class="level" id="alertLevel">🚨 CRITICAL</span>
    <div class="msg" id="alertMsg"></div>
  </div>
  <button class="btn ack" onclick="ackAlert()">确认</button>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('image', this)">📷 图片检测</button>
  <button class="tab-btn" onclick="switchTab('video', this)">🎬 视频检测</button>
</div>

<div class="main">
  <div>
    <div class="panel">
      <div class="panel-header">输入</div>
      <div class="panel-body">
        <div id="imageTab">
          <div class="dropzone" onclick="document.getElementById('imgInput').click()">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M18 6h.008v.008H18V6z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V6A2.25 2.25 0 0019.5 3.75h-15A2.25 2.25 0 002.25 6v12z"/></svg>
            <p>拖拽图片到这里<br>或点击上传</p>
          </div>
          <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="detectImage()">
        </div>
        <div id="videoTab" style="display:none">
          <div class="dropzone" onclick="document.getElementById('vidInput').click()">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9a2.25 2.25 0 002.25 2.25z"/></svg>
            <p>上传视频文件<br>支持 mp4 / avi / mov</p>
          </div>
          <input type="file" id="vidInput" accept="video/*" style="display:none" onchange="detectVideo()">
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <div class="panel-header">统计</div>
      <div class="panel-body">
        <div class="stats-grid">
          <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">总事件</div></div>
          <div class="stat-card"><div class="num" style="color:#f85149" id="stat-falls">0</div><div class="label">跌倒次数</div></div>
          <div class="stat-card"><div class="num" style="color:#d29922" id="stat-critical">0</div><div class="label">危急</div></div>
          <div class="stat-card"><div class="num" style="color:#bc8cff" id="stat-emergency">0</div><div class="label">紧急</div></div>
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="panel">
      <div class="panel-header">检测结果</div>
      <div class="panel-body">
        <div class="loading" id="loading"><div class="spinner"></div>检测中...</div>
        <div class="result-area" id="resultArea">
          <p style="color:#30363d;text-align:center;padding:60px 0">上传图片或视频开始检测</p>
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="panel">
      <div class="panel-header">事件时间线</div>
      <div class="panel-body" id="timeline" style="max-height:500px;overflow-y:auto">
        <p style="color:#30363d;font-size:12px">暂无事件</p>
      </div>
    </div>
  </div>
</div>

</div>

<script src="data:text/javascript;base64,cHJpbnQoJ2hlbGxvJyk="></script>
<script>
let activeTab = 'image';
let latestResult = null;

function switchTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('imageTab').style.display = tab === 'image' ? 'block' : 'none';
  document.getElementById('videoTab').style.display = tab === 'video' ? 'block' : 'none';
}

function showLoading() { document.getElementById('loading').style.display = 'block'; }
function hideLoading() { document.getElementById('loading').style.display = 'none'; }

function showAlert(level, msg) {
  const banner = document.getElementById('alertBanner');
  document.getElementById('alertLevel').textContent = `${level === 'CRITICAL' ? '🚨' : level === 'EMERGENCY' ? '🆘' : '⚠️'} ${level}`;
  document.getElementById('alertMsg').textContent = msg;
  banner.classList.add('show');
}

function ackAlert() {
  document.getElementById('alertBanner').classList.remove('show');
}

async function detectImage() {
  const input = document.getElementById('imgInput');
  if (!input.files[0]) return;
  const fd = new FormData();
  fd.append('image', input.files[0]);
  showLoading();
  try {
    const res = await fetch('/api/detect/image', { method: 'POST', body: fd });
    const data = await res.json();
    renderImageResult(data);
    if (data.label === 'FALL') showAlert('CRITICAL', `图片检测到跌倒！置信度 ${(data.confidence*100).toFixed(0)}%`);
    loadTimeline(); loadStats();
  } catch(e) { console.error(e); }
  hideLoading();
}

function renderImageResult(data) {
  let html = `<img src="${data.annotated_url}" class="result-img"><br><br>`;
  html += `<span class="badge ${data.label === 'FALL' ? 'critical' : 'none'}">${data.label === 'FALL' ? '🚨 检测到跌倒' : '✅ 正常'} (置信度 ${(data.confidence*100).toFixed(0)}%)</span>`;
  if (data.persons) {
    data.persons.forEach(p => {
      const isFall = p.label === 'FALL';
      html += `<div class="person-card" style="margin-top:8px">
        <div class="label ${isFall ? 'fall' : 'normal'}">人员 ${p.person_id}: ${isFall ? '🚨 跌倒' : '✅ 正常'}</div>
        <div class="feature-row"><span>躯干角度</span>${p.angle_deg}°</div>
        <div class="feature-row"><span>宽高比</span>${p.aspect_ratio}</div>
        <div class="feature-row"><span>重心高度</span>${p.cog_height}</div>
        ${p.triggers && p.triggers.length ? `<div class="feature-row"><span>触发规则</span>${p.triggers.join(', ')}</div>` : ''}
        <div class="conf-bar"><div class="conf-fill ${isFall ? 'red' : 'green'}" style="width:${p.confidence*100}%"></div></div>
      </div>`;
    });
  }
  document.getElementById('resultArea').innerHTML = html;
}

async function detectVideo() {
  const input = document.getElementById('vidInput');
  if (!input.files[0]) return;
  const fd = new FormData();
  fd.append('video', input.files[0]);
  showLoading();
  document.getElementById('resultArea').innerHTML = '<p style="color:#8b949e;text-align:center;padding:40px 0">正在处理视频（CPU 推理，请耐心等待）...</p>';
  try {
    const res = await fetch('/api/detect/video', { method: 'POST', body: fd });
    const data = await res.json();
    renderVideoResult(data);
    if (data.total_falls > 0) showAlert('CRITICAL', `视频检出 ${data.total_falls} 次跌倒事件！`);
    loadTimeline(); loadStats();
  } catch(e) { console.error(e); }
  hideLoading();
}

function renderVideoResult(data) {
  let html = `<video src="${data.video_url}" controls style="max-width:100%;border-radius:6px"></video><br><br>`;
  html += `<span class="badge ${data.total_falls > 0 ? 'critical' : 'none'}">检出 ${data.total_falls} 次跌倒 | ${data.persons_tracked} 人 | 耗时 ${data.elapsed_s}s</span>`;

  // Render state transitions
  const transitions = data.state_transitions || [];
  if (transitions.length > 0) {
    html += `<div style="margin-top:12px"><p style="font-size:12px;color:#484f58;margin-bottom:6px">状态流转：</p>`;
    transitions.forEach(t => {
      const cls = t.to === 'fallen' ? 'fall' : t.to === 'falling' ? 'warn' : 'ok';
      const badge = t.to === 'fallen' ? 'critical' : t.to === 'falling' ? 'warning' : 'info';
      html += `<div class="transition-detail ${cls}" style="margin-bottom:4px">
        <span class="badge ${badge}">Track ${t.track_id}</span>
        <span class="transition ${t.to === 'fallen' ? 'to-fallen' : t.to === 'falling' ? 'to-falling' : 'to-upright'}" style="margin-left:6px">
          ${t.from} → ${t.to}
        </span>
        <span style="color:#484f58;font-size:11px;margin-left:6px">@frame ${t.frame}</span>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('resultArea').innerHTML = html;
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const s = await res.json();
    document.getElementById('stat-total').textContent = s.total_events;
    document.getElementById('stat-falls').textContent = s.total_falls;
    document.getElementById('stat-critical').textContent = s.critical_alerts;
    document.getElementById('stat-emergency').textContent = s.emergency_alerts;
    document.getElementById('stat-alerts').textContent = `警报: ${s.unacknowledged}`;
  } catch(e) {}
}

async function loadTimeline() {
  try {
    const res = await fetch('/api/events');
    const events = await res.json();
    const el = document.getElementById('timeline');
    if (!events.length) { el.innerHTML = '<p style="color:#30363d;font-size:12px">暂无事件</p>'; return; }
    el.innerHTML = events.map(e => {
      const d = new Date(e.timestamp * 1000);
      const level = e.alert_level === 'CRITICAL' ? 'critical' : e.alert_level === 'EMERGENCY' ? 'emergency' : e.alert_level === 'WARNING' ? 'warning' : 'info';
      const isFall = e.state === 'falling' || e.state === 'fallen';
      return `<div class="timeline-item">
        <div class="time">${d.toLocaleTimeString()}</div>
        <div style="margin-top:4px">
          <span class="badge ${level}">${e.state || e.alert_level}</span>
          <span style="margin-left:6px;color:#8b949e">Track ${e.track_id}</span>
        </div>
        ${e.reason ? `<div class="msg">${e.reason}</div>` : ''}
      </div>`;
    }).join('');
  } catch(e) {}
}

loadStats();
loadTimeline();
setInterval(() => { loadStats(); loadTimeline(); }, 10000);
</script>
</body>
</html>
